name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Discoscope.slnx
      - run: dotnet build Discoscope.slnx --configuration Release --no-restore
      - run: dotnet test tests/Discoscope.Core.Tests --configuration Release --no-build
